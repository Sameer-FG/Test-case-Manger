<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧪 Test Case Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080c15;--surface:#0d1424;--card:#141e30;--card2:#1a2840;
  --border:rgba(255,255,255,.07);--bh:rgba(255,255,255,.13);
  --accent:#6366f1;--ag:linear-gradient(135deg,#6366f1,#818cf8);
  --text:#e2e8f0;--dim:#94a3b8;--muted:#4b5e79;
  --pass:#22c55e;--fail:#ef4444;--blocked:#f59e0b;--inprog:#3b82f6;--notrun:#4b5e79;--skip:#a855f7;
  --crit:#ef4444;--high:#f59e0b;--med:#6366f1;--low:#4b5e79;
  --sh:0 8px 32px rgba(0,0,0,.5);--rad:10px;--tr:.18s ease;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
#app{display:flex;flex-direction:column;height:100vh}

/* Header */
#hdr{display:flex;align-items:center;gap:7px;padding:0 14px;height:52px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10}
.logo{font-weight:700;font-size:15px;background:var(--ag);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;margin-right:4px}
.pl{font-size:11px;color:var(--muted);white-space:nowrap}
#proj-sel{background:var(--card);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:6px;font-size:12px;cursor:pointer;outline:none;font-family:inherit;max-width:130px}
.hsp{flex:1}
.srv-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.hbtn{display:flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--border);background:var(--card);color:var(--dim);border-radius:7px;font-size:11px;cursor:pointer;transition:var(--tr);font-family:inherit;white-space:nowrap;flex-shrink:0}
.hbtn:hover{background:var(--card2);border-color:var(--bh);color:var(--text)}
.hbtn.ac{background:var(--accent);border-color:transparent;color:#fff}.hbtn.ac:hover{opacity:.88}
.hbtn.doc{background:rgba(99,102,241,.15);border-color:rgba(99,102,241,.3);color:#818cf8}.hbtn.doc:hover{background:rgba(99,102,241,.25)}

/* Navigation tabs */
#nav{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 14px;flex-shrink:0}
.nav-btn{padding:0 16px;height:40px;border:none;background:transparent;color:var(--dim);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;transition:var(--tr)}
.nav-btn:hover{color:var(--text)}
.nav-btn.on{color:var(--accent);border-bottom-color:var(--accent)}

/* Views */
#views{flex:1;overflow:hidden;display:flex;flex-direction:column}
.view{flex:1;display:none;overflow:hidden}
.view.on{display:flex}

/* ── Dashboard ── */
#view-dashboard{flex-direction:column;overflow-y:auto;padding:24px}
.db-head{display:flex;align-items:center;margin-bottom:20px}
.db-head h2{font-size:18px;font-weight:700;flex:1}
.db-proj-sel{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:7px;font-size:12px;cursor:pointer;outline:none;font-family:inherit}
.db-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:24px}
.db-stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:16px;text-align:center}
.db-stat-card .val{font-size:28px;font-weight:700;line-height:1.2}
.db-stat-card .lbl{font-size:11px;color:var(--muted);font-weight:500;margin-top:4px}
.db-sec-title{font-size:12px;font-weight:600;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
.stack-bar{height:10px;border-radius:5px;display:flex;overflow:hidden;background:var(--card2);margin:10px 0}
.stack-seg{height:100%;transition:width .5s}
.stack-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin-bottom:16px}
.ll{display:flex;align-items:center;gap:4px}.ld{width:8px;height:8px;border-radius:50%}
.run-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:12px 16px;margin-bottom:8px;cursor:pointer;transition:var(--tr)}
.run-row:hover{border-color:var(--bh);background:var(--card2)}
.run-row .rr-name{font-weight:600;font-size:13px;flex:1}
.run-row .rr-meta{font-size:11px;color:var(--muted)}
.run-badge{padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}

/* ── Test Cases (sidebar+detail) ── */
#view-cases{display:none}
#view-cases.on{display:flex}
#sidebar{width:290px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--surface);flex-shrink:0}
#sh{padding:10px 12px;border-bottom:1px solid var(--border)}
.sw{position:relative;margin-bottom:7px}
.sw input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 10px 6px 28px;border-radius:7px;font-size:12px;outline:none;transition:var(--tr);font-family:inherit}
.sw input:focus{border-color:var(--accent)}
.sw::before{content:'🔍';position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:11px;pointer-events:none}
.fr{display:flex;gap:5px;flex-wrap:wrap}
.fb{padding:3px 8px;border-radius:20px;font-size:10px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);transition:var(--tr);font-family:inherit}
.fb:hover,.fb.on{background:var(--accent);border-color:transparent;color:#fff}
#cl{flex:1;overflow-y:auto;padding:4px 0}
.ci{display:flex;align-items:center;gap:7px;padding:9px 12px;cursor:pointer;border-left:3px solid transparent;transition:var(--tr)}
.ci:hover{background:rgba(255,255,255,.03)}
.ci.on{background:rgba(99,102,241,.12);border-left-color:var(--accent)}
.cd{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cf{flex:1;min-width:0}
.ci-id{font-size:10px;color:var(--muted);font-weight:600}
.ci-s{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ci-m{font-size:10px;color:var(--muted);margin-top:1px}
#detail{flex:1;display:flex;flex-direction:column;overflow:hidden}
#dp{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted)}
#dp .ic{font-size:44px;opacity:.25}
#dd{flex:1;overflow-y:auto;padding:22px 26px;display:none}
.dh textarea{width:100%;background:transparent;border:none;color:var(--text);font-size:17px;font-weight:600;font-family:inherit;resize:none;outline:none;line-height:1.4;margin-bottom:14px}
.dm{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.cs{background:var(--card);border:1px solid var(--border);color:var(--text);padding:5px 9px;border-radius:6px;font-size:12px;cursor:pointer;outline:none;font-family:inherit}
.sc{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;border:none;font-family:inherit}
.fail-info{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px}
.fail-info .fr-lbl{font-size:10px;color:var(--fail);font-weight:700;letter-spacing:.4px;margin-bottom:4px}
.fail-info a{color:var(--inprog);text-decoration:underline}
.sl{font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.sk{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:12px;margin-bottom:9px}
.sk:hover{border-color:var(--bh)}
.sn{font-size:10px;font-weight:700;color:var(--muted);margin-bottom:5px}
.sf{margin-bottom:7px}
.sf label{font-size:10px;color:var(--muted);display:block;margin-bottom:3px;font-weight:500}
.sf textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 9px;font-size:12px;font-family:inherit;resize:none;outline:none;transition:var(--tr);line-height:1.5}
.sf textarea:focus{border-color:var(--accent)}
.sa{display:flex;gap:5px;align-items:center;margin-top:6px}
.sb{padding:3px 9px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:var(--tr)}
.sb.pass{background:rgba(34,197,94,.15);color:var(--pass)}
.sb.fail{background:rgba(239,68,68,.15);color:var(--fail)}
.sb.blk{background:rgba(245,158,11,.15);color:var(--blocked)}
.sb.skip{background:rgba(168,85,247,.15);color:var(--skip)}
.sb:hover{filter:brightness(1.2)}
.sd{width:7px;height:7px;border-radius:50%;margin-left:auto}
.asb{display:flex;align-items:center;gap:5px;padding:7px 12px;background:transparent;border:1px dashed var(--border);color:var(--muted);border-radius:var(--rad);font-size:12px;cursor:pointer;font-family:inherit;transition:var(--tr);width:100%;justify-content:center;margin-bottom:18px}
.asb:hover{border-color:var(--accent);color:var(--accent)}
.ab{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}
.btn{padding:7px 13px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:var(--tr);display:flex;align-items:center;gap:4px}
.btn.pass{background:rgba(34,197,94,.15);color:var(--pass)}
.btn.fail{background:rgba(239,68,68,.15);color:var(--fail)}
.btn.blk{background:rgba(245,158,11,.15);color:var(--blocked)}
.btn.skip{background:rgba(168,85,247,.15);color:var(--skip)}
.btn.rst{background:rgba(255,255,255,.06);color:var(--dim)}
.btn.del{background:rgba(239,68,68,.1);color:var(--fail);margin-left:auto}
.btn:hover{filter:brightness(1.2)}
.tr-row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:9px 14px;margin-bottom:14px}
.tv{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px;flex:1}
.tbtn{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:var(--tr)}
.tbtn.st{background:rgba(34,197,94,.2);color:var(--pass)}.tbtn.sp{background:rgba(239,68,68,.2);color:var(--fail)}.tbtn.rs{background:rgba(255,255,255,.06);color:var(--dim)}.tbtn:hover{filter:brightness(1.2)}
.emp{padding:32px 16px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}

/* ── Test Runs ── */
#view-runs{display:none}
#view-runs.on{display:flex}
#run-list-pane{width:290px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--surface)}
#run-list-head{padding:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
#run-list-head span{font-size:13px;font-weight:600;flex:1}
#run-items{flex:1;overflow-y:auto;padding:6px 0}
.ri{padding:10px 14px;cursor:pointer;border-left:3px solid transparent;transition:var(--tr)}
.ri:hover{background:rgba(255,255,255,.03)}
.ri.on{background:rgba(99,102,241,.12);border-left-color:var(--accent)}
.ri-name{font-size:12px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-meta{font-size:10px;color:var(--muted)}
.ri-prog{height:3px;border-radius:2px;background:var(--card2);margin-top:5px;overflow:hidden}
.ri-pb{height:100%;background:var(--pass);border-radius:2px;transition:width .4s}
#run-detail-pane{flex:1;display:flex;flex-direction:column;overflow:hidden}
#run-dp{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted)}
#run-dd{flex:1;overflow-y:auto;padding:20px 24px;display:none}
.run-hdr{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.run-hdr-info{flex:1}
.run-hdr-info h2{font-size:18px;font-weight:700;margin-bottom:4px}
.run-hdr-meta{font-size:12px;color:var(--muted)}
.run-stats-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.rst-chip{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
.run-case-row{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:12px 14px;margin-bottom:8px;transition:var(--tr)}
.run-case-row:hover{border-color:var(--bh)}
.rcr-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rcr-id{font-size:10px;font-weight:700;color:var(--muted)}
.rcr-sum{font-size:13px;font-weight:500;flex:1}
.rcr-status{font-size:11px;font-weight:600}
.rcr-btns{display:flex;gap:6px;flex-wrap:wrap}
.rcr-fail-info{margin-top:8px;padding:8px 12px;background:rgba(239,68,68,.08);border-radius:6px;font-size:11px;border-left:3px solid var(--fail)}
.rcr-fail-info .frl{color:var(--fail);font-weight:700;margin-bottom:2px}
.rcr-fail-info a{color:var(--inprog)}
.run-complete-banner{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:var(--rad);padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--pass)}

/* Modals */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;animation:fi .18s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.mo{background:var(--surface);border:1px solid var(--bh);border-radius:16px;width:660px;max-width:96vw;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--sh);animation:su .18s}
.mo.sm{width:460px}
@keyframes su{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.mh{display:flex;align-items:center;padding:16px 20px 12px;border-bottom:1px solid var(--border)}
.mh h2{font-size:15px;font-weight:700;flex:1}
.mc{background:none;border:none;color:var(--muted);font-size:19px;cursor:pointer;padding:2px 6px;border-radius:4px;line-height:1}.mc:hover{color:var(--fail)}
.mb{flex:1;overflow-y:auto;padding:18px 20px}
.mf{display:flex;gap:7px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--border);align-items:center}
.fl{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px;display:block;letter-spacing:.4px}
.fa{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:11px;font-size:13px;font-family:inherit;resize:vertical;outline:none;transition:var(--tr);line-height:1.6;min-height:100px}
.fa:focus{border-color:var(--accent)}
.fi2{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:8px 11px;font-size:13px;font-family:inherit;outline:none;transition:var(--tr)}
.fi2:focus{border-color:var(--accent)}
.cb{padding:7px 15px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:var(--tr)}
.cb.pr{background:var(--accent);color:#fff}.cb.pr:hover{opacity:.88}
.cb.gh{background:var(--card);color:var(--dim);border:1px solid var(--border)}.cb.gh:hover{color:var(--text)}
.cb.ok{background:rgba(34,197,94,.2);color:var(--pass)}.cb.ok:hover{background:rgba(34,197,94,.3)}
.cb.danger{background:rgba(239,68,68,.2);color:var(--fail);border:1px solid rgba(239,68,68,.3)}.cb.danger:hover{background:rgba(239,68,68,.3)}
.pc{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:10px}
.ps{display:flex;gap:7px;padding:3px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,.04)}
.ps:last-child{border:none}
.ps-n{color:var(--muted);font-weight:600;width:18px;flex-shrink:0;font-size:11px}
.ps-b{flex:1}.ps-d{color:var(--text)}.ps-e{color:var(--dim);font-style:italic;margin-top:1px;font-size:11px}
.psr{display:flex;align-items:center;gap:7px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.psr input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent);cursor:pointer}
.tag{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600}
/* Case selector for new run */
.case-sel-list{max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
.cs-group-head{padding:6px 12px;font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--muted);background:var(--surface);position:sticky;top:0;text-transform:uppercase}
.cs-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:var(--tr)}
.cs-item:last-child{border:none}
.cs-item:hover{background:rgba(255,255,255,.03)}
.cs-item input{accent-color:var(--accent);cursor:pointer;width:14px;height:14px;flex-shrink:0}
.cs-item .cs-id{font-size:10px;font-weight:700;color:var(--muted);width:52px;flex-shrink:0}
.cs-item .cs-sum{font-size:12px;flex:1}
/* Drop zone */
.drop-zone{border:2px dashed var(--border);border-radius:12px;padding:28px;text-align:center;cursor:pointer;transition:var(--tr);position:relative}
.drop-zone:hover,.drop-zone.drag{border-color:var(--accent);background:rgba(99,102,241,.05)}
.drop-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop-zone .dz-ic{font-size:34px;margin-bottom:8px;display:block}
.drop-zone p{font-size:13px;color:var(--dim)}
.drop-zone small{font-size:11px;color:var(--muted)}
.prog-bar-wrap{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:10px;display:none}
.prog-bar-fill{height:100%;background:var(--accent);transition:width .3s;border-radius:4px}
.proj-item{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--card);border-radius:7px;margin-bottom:5px;border:1px solid var(--border)}
.proj-item .pn{flex:1;font-weight:500;font-size:13px;cursor:pointer}
.proj-item .pd{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:2px 5px;border-radius:4px}.proj-item .pd:hover{color:var(--fail)}
</style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div id="hdr">
    <span class="logo">🧪 TCM</span>
    <span class="pl">Project:</span>
    <select id="proj-sel" onchange="setProject(this.value)"></select>
    <button class="hbtn" onclick="openProjModal()" title="Manage projects">📁</button>
    <button class="hbtn" onclick="openFoldersModal()" title="Manage folders">⚙️ Folders</button>
    <span class="hsp"></span>
    <div class="srv-dot" id="srv-dot" style="background:var(--muted)" title="Server connection"></div>
    <button class="hbtn doc" onclick="openDocModal()">📄 Import Doc</button>
    <button class="hbtn" onclick="openGenModal()">⚡ Generate</button>
    <button class="hbtn" onclick="openImportJSON()">↓ Import JSON</button>
    <button class="hbtn" onclick="exportJSON()">↑ Export JSON</button>
    <button class="hbtn ac" onclick="createCase()">＋ New Case</button>
    <div id="user-profile-widget" style="display:none;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:4px 10px 4px 6px;cursor:pointer;position:relative" onclick="toggleProfileMenu()">
      <div id="upw-avatar" style="width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;flex-shrink:0">?</div>
      <div style="max-width:110px;overflow:hidden">
        <div id="upw-name" style="font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
        <div id="upw-email" style="font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
      </div>
      <div id="upw-menu" style="display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px;min-width:160px;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.4)">
        <button onclick="event.stopPropagation();showSwitchAccount()" style="width:100%;text-align:left;padding:7px 10px;background:none;border:none;color:var(--text);cursor:pointer;border-radius:5px;font-size:12px;font-family:inherit" onmouseover="this.style.background='rgba(255,255,255,.06)'" onmouseout="this.style.background='none'">🔄 Switch Account</button>

<script>
// ── Constants ──
const STATUS   = ['Not Run','In Progress','Pass','Fail','Blocked','Skipped'];
const PRIORITY = ['Low','Medium','High','Critical'];
const SC = ['var(--notrun)','var(--inprog)','var(--pass)','var(--fail)','var(--blocked)','var(--skip)'];
const PC = ['var(--low)','var(--med)','var(--high)','var(--crit)'];
const IS_SERVER = window.location.protocol !== 'file:';

// ── State ──
let repo = { projects:[], categories:[], testCases:[], testRuns:[], runResults:{}, nextId:1, nextRunId:1, autoScannedProjects:[] };
let activeProject='', selectedId='', selectedRunId='', filterStatus=-1, timers={};
let selectedCases=new Set();
let collapsedCategories = new Set();
function toggleMainCategory(cat) {
  if (collapsedCategories.has(cat)) collapsedCategories.delete(cat);
  else collapsedCategories.add(cat);
  renderList();
}
let runFilterStatus=-1;
let generatedCases=[], genSelected=[], _failCb=null;

// ── Server & Auth ──
let teamKey = localStorage.getItem('tcm_team_key')||'';
let userProfile = null;
try { userProfile = JSON.parse(localStorage.getItem('tcm_profile')||'null'); } catch(e){}

let _pollTimer = null;
async function pingServer(){ 
  if(!IS_SERVER)return; 
  try{
    const r=await fetch('/api/check-auth', {headers:{'Authorization': teamKey}});
    const d=await r.json();
    if(d.locked && !d.ok) { stopPolling(); showUnlockScreen(); return; }
    
    const pingR = await fetch('/api/ping');
    const pingD = await pingR.json();
    const srvDot = document.getElementById('srv-dot');
    
    if(pingD.ok) {
      if(pingD.isDb) {
        srvDot.style.background = 'var(--pass)';
        srvDot.title = 'Server connection: OK (MongoDB Active)';
      } else {
        srvDot.style.background = 'var(--inprog)';
        srvDot.title = 'Server connection: OK (Local File Storage)';
      }
    } else {
      srvDot.style.background = 'var(--fail)';
      srvDot.title = 'Server connection: FAILED';
    }
    renderProfile();
  }catch{
    const srvDot = document.getElementById('srv-dot');
    if (srvDot) {
      srvDot.style.background='var(--fail)';
      srvDot.title = 'Server connection: FAILED';
    }
  } 
}
setInterval(pingServer,15000); 
// Show profile immediately from saved localStorage state (before any network call)
renderProfile();
pingServer();

// ── Real-time Polling Sync ──
function startPolling(){
  stopPolling();
  _pollTimer = setInterval(async ()=>{
    if(!IS_SERVER) return;
    try{
      const r = await fetch('/api/repo',{headers:{'Authorization':teamKey}});
      if(!r.ok) return;
      const fresh = await r.json();
      const freshStr = JSON.stringify(fresh);
      const currentStr = JSON.stringify(repo);
      if(freshStr !== currentStr){
        applyRepo(fresh);
        localStorage.setItem('tcm_repo', freshStr);
        shadowRepo = JSON.parse(freshStr);
      }
    }catch{}
  }, 10000); // Poll every 10 seconds
}
function stopPolling(){ if(_pollTimer){clearInterval(_pollTimer);_pollTimer=null;} }

function renderProfile() {
  const widget = document.getElementById('user-profile-widget');
  if(!widget) return;
  if(userProfile) {
    const ini = userProfile.name ? userProfile.name.charAt(0).toUpperCase() : '?';
    document.getElementById('upw-avatar').textContent = ini;
    document.getElementById('upw-name').textContent = userProfile.name;
    document.getElementById('upw-email').textContent = userProfile.email;
    document.getElementById('upw-menu').innerHTML = `
      <button onclick="event.stopPropagation();showSwitchAccount()" style="width:100%;text-align:left;padding:7px 10px;background:none;border:none;color:var(--text);cursor:pointer;border-radius:5px;font-size:12px;font-family:inherit" onmouseover="this.style.background='rgba(255,255,255,.06)'" onmouseout="this.style.background='none'">🔄 Switch Account</button>
      <button onclick="event.stopPropagation();logoutUser()" style="width:100%;text-align:left;padding:7px 10px;background:none;border:none;color:var(--fail);cursor:pointer;border-radius:5px;font-size:12px;font-family:inherit" onmouseover="this.style.background='rgba(255,255,255,.06)'" onmouseout="this.style.background='none'">🚪 Logout</button>
    `;
    widget.style.display = 'flex';
  } else {
    document.getElementById('upw-avatar').textContent = '👤';
    document.getElementById('upw-name').textContent = 'Guest';
    document.getElementById('upw-email').textContent = 'Not logged in';
    document.getElementById('upw-menu').innerHTML = `
      <button onclick="event.stopPropagation();showSwitchAccount()" style="width:100%;text-align:left;padding:7px 10px;background:none;border:none;color:var(--pass);cursor:pointer;border-radius:5px;font-size:12px;font-family:inherit" onmouseover="this.style.background='rgba(255,255,255,.06)'" onmouseout="this.style.background='none'">🔑 Login / Set Profile</button>
    `;
    widget.style.display = 'flex';
  }
}
function toggleProfileMenu() {
  const menu = document.getElementById('upw-menu');
  if(!menu) return;
  menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
  if(menu.style.display === 'block') {
    setTimeout(() => document.addEventListener('click', ()=>menu.style.display='none', {once:true}), 10);
  }
}
function logoutUser(){
  if(!confirm('Log out? You will need the Team Key to log back in.'))return;
  if(userProfile) localStorage.setItem('tcm_last_profile', JSON.stringify(userProfile));
  teamKey=''; userProfile=null;
  localStorage.removeItem('tcm_team_key');
  localStorage.removeItem('tcm_profile');
  stopPolling();
  renderProfile();
  showUnlockScreen();
}
function showSwitchAccount(){
  // Re-open login but pre-fill team key, blank the name/email
  const oldKey = teamKey;
  if(document.getElementById('unlock-modal'))return;
  const d = document.createElement('div'); d.id='unlock-modal';
  d.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:9999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)";
  d.innerHTML=`<div class="modal" style="width:360px"><div class="mh" style="margin-bottom:15px"><h2 style="text-align:center;width:100%">🔑 Login / Switch Account</h2></div>
    <div class="mb">
      <div style="margin-bottom:12px"><span class="fl">TEAM KEY</span><input id="tk-input" class="fi2" type="password" value="${oldKey}" placeholder="Team Key" onkeydown="if(event.key==='Enter')unlockApp()"></div>
      <div style="margin-bottom:12px"><span class="fl">YOUR NAME</span><input id="tk-name" class="fi2" type="text" placeholder="Your full name" onkeydown="if(event.key==='Enter')unlockApp()"></div>
      <div style="margin-bottom:18px"><span class="fl">EMAIL ADDRESS</span><input id="tk-email" class="fi2" type="email" placeholder="your@felicitygames.com" onkeydown="if(event.key==='Enter')unlockApp()"></div>
      <button class="cb pr" style="width:100%;margin-bottom:8px" onclick="unlockApp()">Login</button>
      <button class="cb gh" style="width:100%" onclick="document.getElementById('unlock-modal').remove()">Cancel</button>
    </div></div>`;
  document.body.appendChild(d);
}

function showUnlockScreen(){
  if(document.getElementById('unlock-modal')) return;
  let lastProfile = userProfile;
  if (!lastProfile) { try { lastProfile = JSON.parse(localStorage.getItem('tcm_last_profile')||'null'); } catch(e){} }

  const d = document.createElement('div'); d.id='unlock-modal';
  d.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:9999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)";
  
  let profileHtml = '';
  if (lastProfile) {
    const ini = lastProfile.name ? lastProfile.name.charAt(0).toUpperCase() : '?';
    profileHtml = `
      <div style="display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--accent);border-radius:8px;padding:12px;margin-bottom:16px;cursor:pointer" onclick="unlockApp(true)">
        <div style="width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:15px;flex-shrink:0">${ini}</div>
        <div style="flex:1;overflow:hidden">
          <div style="font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Log in as ${esc(lastProfile.name)}</div>
          <div style="color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(lastProfile.email)}</div>
        </div>
      </div>
      <div style="text-align:center;font-size:11px;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:1px">Or enter details below</div>
    `;
  }

  d.innerHTML=`<div class="modal" style="width:360px;text-align:left"><div class="mh" style="margin-bottom:15px"><h2 style="text-align:center;width:100%">🔒 Team Access Restricted</h2></div>
    <div class="mb">
      ${profileHtml}
      <div style="margin-bottom:12px"><span class="fl">TEAM KEY</span><input id="tk-input" class="fi2" type="password" placeholder="Ask your admin for the key" value="${teamKey}" onkeydown="if(event.key==='Enter')unlockApp()"></div>
      <div style="margin-bottom:12px"><span class="fl">YOUR NAME</span><input id="tk-name" class="fi2" type="text" placeholder="e.g. Jane Doe" value="${lastProfile?esc(lastProfile.name):''}" onkeydown="if(event.key==='Enter')unlockApp()"></div>
      <div style="margin-bottom:18px"><span class="fl">EMAIL ADDRESS</span><input id="tk-email" class="fi2" type="email" placeholder="e.g. jane@felicitygames.com" value="${lastProfile?esc(lastProfile.email):''}" onkeydown="if(event.key==='Enter')unlockApp()"></div>
      <button id="tk-btn" class="cb pr" style="width:100%" onclick="unlockApp()">Unlock & Login</button>
    </div></div>`;
  document.body.appendChild(d);
}
async function unlockApp(useLastProfile = false){
  const tk = document.getElementById('tk-input').value;
  let nm = document.getElementById('tk-name').value.trim();
  let em = document.getElementById('tk-email').value.trim();
  
  if (useLastProfile === true) {
    try {
      const lastProfile = JSON.parse(localStorage.getItem('tcm_last_profile'));
      if (lastProfile) { nm = lastProfile.name; em = lastProfile.email; }
    } catch(e) {}
    if (!tk) {
      document.getElementById('tk-input').focus();
      return; // Just focus if key is missing, no alert
    }
  }

  if(!tk || !nm || !em) { alert('Please fill in all fields.'); return; }

  const btn = document.getElementById('tk-btn') || document.querySelector('#unlock-modal .cb.pr');
  const oldText = btn.textContent;
  btn.textContent = 'Verifying...';
  btn.disabled = true;

  if(IS_SERVER) {
    try {
      const r = await fetch('/api/check-auth', {headers:{'Authorization': tk}});
      const d = await r.json();
      if(!d.ok) {
        alert('Incorrect Team Key!');
        btn.textContent = oldText;
        btn.disabled = false;
        return;
      }
    } catch(e) {
      alert('Network error verifying key.');
      btn.textContent = oldText;
      btn.disabled = false;
      return;
    }
  }

  teamKey = tk; userProfile = { name: nm, email: em };
  localStorage.setItem('tcm_team_key', teamKey);
  localStorage.setItem('tcm_profile', JSON.stringify(userProfile));
  localStorage.setItem('tcm_last_profile', JSON.stringify(userProfile));
  
  const m = document.getElementById('unlock-modal');
  if(m) m.remove();
  
  renderProfile(); 
  pingServer(); 
  load().then(()=>startPolling());
}

// ── Storage ──
let shadowRepo = null;
let _st; function save(){clearTimeout(_st);_st=setTimeout(doSave,300);}
async function doSave(){
  if(IS_SERVER && shadowRepo){
    try{
      const pl = { projects: repo.projects, categories: repo.categories, nextId: repo.nextId, nextRunId: repo.nextRunId, fullRepoFallback: repo };
      pl.updatedCases = repo.testCases.filter(c => JSON.stringify(c) !== JSON.stringify(shadowRepo.testCases.find(s=>s.id===c.id)));
      pl.updatedRuns = repo.testRuns.filter(r => JSON.stringify(r) !== JSON.stringify(shadowRepo.testRuns.find(s=>s.id===r.id)));
      
      const deletedCases = shadowRepo.testCases.filter(s => !repo.testCases.find(c => c.id === s.id)).map(s => s.id);
      const deletedRuns = shadowRepo.testRuns.filter(s => !repo.testRuns.find(r => r.id === s.id)).map(s => s.id);
      if(deletedCases.length > 0) pl.deletedCases = deletedCases;
      if(deletedRuns.length > 0) pl.deletedRuns = deletedRuns;
      
      pl.updatedResults = {};
      let resultsChanged=false;
      for (const runId in repo.runResults) { if(JSON.stringify(repo.runResults[runId]) !== JSON.stringify(shadowRepo.runResults[runId])) { pl.updatedResults[runId]=repo.runResults[runId]; resultsChanged=true; } }
      if (!resultsChanged) delete pl.updatedResults;
      
      const r = await fetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json','Authorization':teamKey},body:JSON.stringify(pl)});
      if (r.ok) shadowRepo = JSON.parse(JSON.stringify(repo));
    }catch(e){console.warn(e);}
  }
  localStorage.setItem('tcm_repo',JSON.stringify(repo));
}
async function load(){
  // 1. Paint from localStorage immediately so page is never blank on refresh
  const cached = localStorage.getItem('tcm_repo');
  if(cached){try{const d=JSON.parse(cached);applyRepo(d);}catch{}}
  // 2. Then try server for latest data
  if(IS_SERVER){
    try {
      const r=await fetch('/api/repo',{headers:{'Authorization': teamKey}});
      if(r.ok){
        const d=await r.json();
        // Self-heal: If server is completely blank (e.g. Render restarted and wiped ephemeral file)
        // but we have data locally, upload our local data to restore the server.
        if (d.projects.length === 0 && d.testCases.length === 0 && repo.projects.length > 0) {
          console.warn("Server is blank. Restoring data from local browser cache...");
          save(); // Trigger a sync back to server
        } else {
          applyRepo(d);
          localStorage.setItem('tcm_repo',JSON.stringify(d));
        }
      }
    }catch{}
  }
  renderProfile();
}
function applyRepo(data){
  repo=data;
  if(!repo.projects)repo.projects=[];
  if(!repo.categories||repo.categories.length===0)repo.categories=['UI','Gameplay','Economy','Audio','Settings','Network','Performance','Analytics','Other'];
  if(!repo.testCases)repo.testCases=[];
  
  // Migration for old test cases with integer categories
  let migrated = false;
  repo.testCases.forEach(tc => { 
    if(typeof tc.category === 'number') { tc.category = repo.categories[tc.category] || 'Other'; migrated = true; }
  });
  if(migrated) setTimeout(doSave, 1000); // trigger save to persist migration to server

  if(!repo.testRuns)repo.testRuns=[];
  if(!repo.runResults)repo.runResults={};
  if(!repo.nextId)repo.nextId=1;
  if(!repo.nextRunId)repo.nextRunId=1;
  if(!repo.autoScannedProjects)repo.autoScannedProjects=[];
  if(!repo.platforms)repo.platforms={};
  shadowRepo=JSON.parse(JSON.stringify(repo));
  if(repo.projects.length>0 && !activeProject) activeProject=repo.projects[0];
  renderAll(); renderRuns(); renderDashboard();
}

// ── Navigation ──
function switchView(v){
  document.querySelectorAll('.view').forEach(el=>{el.classList.remove('on');});
  document.getElementById('view-'+v).classList.add('on');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('on'));
  document.querySelector(`.nav-btn[data-v="${v}"]`).classList.add('on');
  if(v==='dashboard')renderDashboard();
  if(v==='cases'){renderAll();}
  if(v==='runs')renderRuns();
}

// ── Projects ──
function setProject(p){activeProject=p;selectedId='';selectedRunId='';renderAll();renderRuns();renderDashboard();}
function renderProjSel(){
  const s=document.getElementById('proj-sel');
  const opts=repo.projects.length===0?'<option value="">— No projects —</option>':repo.projects.map(p=>`<option value="${esc(p)}"${p===activeProject?' selected':''}>${esc(p)}</option>`).join('');
  if(s) s.innerHTML=opts;
}
function openProjModal(){
  showModal(`<div class="mh"><h2>📁 Projects</h2><button class="mc" onclick="closeModal()">✕</button></div>
  <div class="mb">
    <span class="fl">NEW PROJECT</span>
    <div style="display:flex;gap:8px;margin-bottom:14px"><input id="npi" class="fi2" type="text" placeholder="e.g. Solitaire v2.0" onkeydown="if(event.key==='Enter')addProject()"><button class="cb pr" onclick="addProject()">Add</button></div>
    <span class="fl">EXISTING PROJECTS</span>
    <div id="pitems">${renderProjItems()}</div>
  </div>`,true);
}
function renderProjItems(){return repo.projects.length===0?'<p style="color:var(--muted);font-size:12px;padding:8px 0">No projects yet.</p>':repo.projects.map(p=>`<div class="proj-item"><span class="pn" onclick="setProject('${esc(p)}');closeModal()">${esc(p)}</span><button class="pd" onclick="deleteProject('${esc(p)}')">🗑</button></div>`).join('');}
function addProject(){const v=document.getElementById('npi').value.trim();if(!v||repo.projects.includes(v))return;repo.projects.push(v);activeProject=v;save();renderAll();renderRuns();renderDashboard();document.getElementById('pitems').innerHTML=renderProjItems();document.getElementById('npi').value='';}
function deleteProject(p){if(!confirm(`Delete project "${p}" and ALL its data?`))return;repo.projects=repo.projects.filter(x=>x!==p);repo.testCases=repo.testCases.filter(tc=>tc.project!==p);repo.testRuns=repo.testRuns.filter(r=>r.project!==p);if(activeProject===p)activeProject=repo.projects[0]||'';save();renderAll();renderRuns();renderDashboard();document.getElementById('pitems').innerHTML=renderProjItems();}

// ── Folders ──
function openFoldersModal(){
  showModal(`<div class="mh"><h2>⚙️ Manage Folders</h2><button class="mc" onclick="closeModal()">✕</button></div>
  <div class="mb">
    <span class="fl">NEW FOLDER</span>
    <div style="display:flex;gap:8px;margin-bottom:14px"><input id="nfi" class="fi2" type="text" placeholder="e.g. Multiplayer" onkeydown="if(event.key==='Enter')addFolder()"><button class="cb pr" onclick="addFolder()">Add</button></div>
    <span class="fl">EXISTING FOLDERS</span>
    <div id="fitems">${renderFolderItems()}</div>
  </div>`,true);
}
function renderFolderItems(){
  return repo.categories.map((c,i)=>`<div class="proj-item" style="display:flex;align-items:center;gap:6px">
    <input class="fi2" style="padding:4px 6px;margin:0;flex:1" type="text" id="fc-${i}" value="${esc(c)}">
    <button class="tbtn" style="padding:4px 8px;font-size:11px;background:var(--card2)" onclick="renameFolder(${i}, document.getElementById('fc-${i}').value)">💾</button>
    <button class="pd" onclick="deleteFolder(${i})">🗑</button>
  </div>`).join('');
}
function addFolder() {
  const v=document.getElementById('nfi').value.trim();if(!v||repo.categories.includes(v))return;
  repo.categories.push(v);save();document.getElementById('fitems').innerHTML=renderFolderItems();document.getElementById('nfi').value='';renderAll();
}
function renameFolder(i, newName) {
  newName=newName.trim();if(!newName||repo.categories.includes(newName))return;
  const oldName = repo.categories[i];
  repo.categories[i] = newName;
  repo.testCases.forEach(tc => { if(tc.category === oldName) tc.category = newName; });
  save();document.getElementById('fitems').innerHTML=renderFolderItems();renderAll();
}
function deleteFolder(i) {
  const oldName = repo.categories[i];
  if(!confirm(`Delete folder "${oldName}"? Test cases inside will be moved to "Other".`))return;
  repo.categories.splice(i,1);
  if (!repo.categories.includes('Other')) repo.categories.push('Other');

// Dashboard reads LIVE run results, not stale tc.status
function getProjStats(proj){
  // Aggregate all pass/fail/etc from run results (live execution data)
  let pass=0,fail=0,blocked=0,skip=0,notrun=0;
  const runs=repo.testRuns.filter(r=>r.project===proj);
  const allRunCaseIds = new Set(runs.flatMap(r=>r.caseIds));
  for(const runId of runs.map(r=>r.id)){
    const res=repo.runResults[runId]||{};
    const run=repo.testRuns.find(r=>r.id===runId);
    if(!run) continue;
    for(const cid of run.caseIds){
      const r=res[cid];
      if(!r||r.status===0) notrun++;
      else if(r.status===2) pass++;
      else if(r.status===3) fail++;
      else if(r.status===4) blocked++;
      else if(r.status===5) skip++;
    }
  }
  // Also count cases not in any run as untested
  const allCases=repo.testCases.filter(tc=>tc.project===proj);
  const notInRun=allCases.filter(tc=>!allRunCaseIds.has(tc.id)).length;
  notrun+=notInRun;
  const total=allCases.length;
  const completedRuns=runs.filter(r=>isRunComplete(r.id)).length;
  return{total, pass, fail, blocked, skip, notrun, runs:runs.length, completedRuns};
}

function findDuplicates() {
  if(!activeProject){alert('Please select a project first.');return;}
  const cases = repo.testCases.filter(tc => tc.project === activeProject);
  const groups = {};
  cases.forEach(tc => {
    const norm = tc.summary.toLowerCase().replace(/\\s+/g, ' ').trim();
    if(!groups[norm]) groups[norm] = [];
    groups[norm].push(tc);
  });
  
  const dups = Object.entries(groups).filter(([_, arr]) => arr.length > 1);
  if(dups.length === 0) {
    alert('No duplicate test cases found in this project! 🎉');
    return;
  }
  
  let html = `<div class="mh"><h2>👯 Find Duplicates</h2><button class="mc" onclick="closeModal()">✕</button></div><div class="mb" style="max-height:60vh;overflow-y:auto">`;
  html += `<p style="font-size:13px;color:var(--muted);margin-bottom:16px">Found <b>${dups.length}</b> group(s) of duplicates. The oldest case is kept unchecked by default.</p>`;
  
  let totalDups = 0;
  dups.forEach(([norm, arr]) => {
    // Sort by ID to try to keep the oldest one
    arr.sort((a,b) => a.id.localeCompare(b.id));
    html += `<div style="background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:12px">`;
    html += `<div style="font-size:12px;font-weight:600;margin-bottom:8px;color:var(--txt)">${esc(arr[0].summary)}</div>`;
    
    arr.forEach((tc, idx) => {
      const isChecked = idx > 0; // Check all except the first one
      if (isChecked) totalDups++;
      html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px">
        <input type="checkbox" class="dup-cb" value="${tc.id}" ${isChecked ? 'checked' : ''} style="cursor:pointer;accent-color:var(--fail)">
        <span style="color:var(--accent);width:50px">${tc.id}</span>
        <span style="color:var(--dim);width:70px">📂 ${esc(tc.category||'Other')}</span>
        <span style="color:var(--muted)">${tc.steps.length} steps</span>
      </div>`;
    });
    html += `</div>`;
  });
  html += `</div>
  <div class="mf">
    <button class="cb gh" onclick="closeModal()">Cancel</button>
    <button class="cb danger" onclick="deleteDuplicates()">🗑 Delete Selected</button>
  </div>`;
  
  showModal(html, true);
}

function deleteDuplicates() {

  if(!confirm(\`Delete \${cbs.length} selected duplicate test case(s)? This cannot be undone.\`)) return;

function markStep(tcId,i,status){
  const tc=repo.testCases.find(x=>x.id===tcId);if(!tc)return;tc.steps[i].status=status;

function getRunStats(runId){
  const run=repo.testRuns.find(r=>r.id===runId);if(!run)return{total:0,pass:0,fail:0,blocked:0,skip:0,notrun:0};
  const res=repo.runResults[runId]||{};let pass=0,fail=0,blocked=0,skip=0,notrun=0;
  for(const cid of run.caseIds){const r=res[cid];if(!r||r.status===0)notrun++;else if(r.status===2)pass++;else if(r.status===3)fail++;else if(r.status===4)blocked++;else if(r.status===5)skip++;}
  return{total:run.caseIds.length,pass,fail,blocked,skip,notrun};
}

  else if(runListTab===2 && userProfile) runs=runs.filter(r=>r.testerName===userProfile.name);

  if(!runs.length){el.innerHTML='<div class="emp">No test runs match this filter.</div>';return;}
  el.innerHTML=runs.map(r=>{const s=getRunStats(r.id);const done=isRunComplete(r.id);const pct=s.total>0?Math.round((s.pass+s.fail+s.blocked+s.skip)/s.total*100):0;

}

async function triggerSlackSync(runId) {
  if (!IS_SERVER) { alert('Slack notifications only work when hosted on your team server.'); return; }
  const run=repo.testRuns.find(r=>r.id===runId); if(!run)return;
  const s=getRunStats(runId);
  const isComplete=isRunComplete(runId);
  const pct=s.total>0?Math.round((s.pass+s.fail+s.blocked+s.skip)/s.total*100):0;
  
  // Format failing cases
  const res=repo.runResults[runId]||{};
  let failText = '';
  for(const tcId of run.caseIds){
    const rr=res[tcId];
    if(rr && rr.status===3){
      const tc=repo.testCases.find(x=>x.id===tcId);
      failText += `\n  • *${tc?tc.summary:tcId}*\n    > Bug: ${rr.bugLink||'N/A'} | Reason: ${rr.failReason||'N/A'}`;
    }
  }

  const payload = {
    blocks: [
      { type: "header", text: { type: "plain_text", text: `📢 Test Run Sync: ${run.name}`, emoji: true } },
      { type: "section", text: { type: "mrkdwn", text: `*Project:* ${run.project}\n*Version:* ${run.version}\n*Tester:* ${run.testerName||'Unassigned'}\n*Status:* ${isComplete?'✅ Completed':'⏳ In Progress'} (${pct}%)\n\n*Stats:* ✅ Pass: ${s.pass}  |  ❌ Fail: ${s.fail}  |  🟠 Blocked: ${s.blocked}  |  ⏭ Skip: ${s.skip}  |  ⚪ Untested: ${s.notrun}` } }
    ]
  };

  if (s.fail > 0) {
    payload.blocks.push({ type: "divider" });
    payload.blocks.push({ type: "section", text: { type: "mrkdwn", text: `*❌ Failed Cases:*${failText}` } });
  }

  const btn = event.currentTarget; const orgText = btn.innerHTML; btn.innerHTML='<span class="spinner" style="margin-right:4px"></span> Sending...';
  try {
    await fetch('/api/slack', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': teamKey }, body: JSON.stringify(payload) });
    btn.innerHTML='✅ Sent!'; setTimeout(()=>btn.innerHTML=orgText,2000);
  } catch(e) {
    alert('Failed to send Slack notification.'); btn.innerHTML=orgText;
  }
}

function markRunCaseWithFail(runId,caseId,reason,bugLink){
  if(!repo.runResults[runId])repo.runResults[runId]={};
  repo.runResults[runId][caseId]={status:3,failReason:reason,bugLink:bugLink};
  save();renderRunDetail();renderRuns();
}
function deleteRun(runId){
  if(!confirm('Delete this test run and all its results?'))return;
  repo.testRuns=repo.testRuns.filter(r=>r.id!==runId);
  delete repo.runResults[runId];
  selectedRunId='';save();renderRuns();renderRunDetail();renderDashboard();
}

function runGenerate(){
  const text=document.getElementById('gt').value.trim();if(!text)return;

  const gp=document.getElementById('gp');
  if(!generatedCases.length){gp.innerHTML='<p style="color:var(--muted);font-size:12px;padding:10px 0">Nothing extracted. Try adding more detail.</p>';return;}
  gp.innerHTML=generatedCases.map((tc,i)=>`<div class="pc">
    <div class="psr"><input type="checkbox" id="gc${i}" checked onchange="tgGen(${i})"><label for="gc${i}" style="font-size:12px;font-weight:600;cursor:pointer;flex:1">${esc(tc.summary)}</label>
    <span class="tag" style="background:${PC[tc.priority||1]}22;color:${PC[tc.priority||1]}">${PRIORITY[tc.priority||1]}</span></div>
    <div style="margin-top:7px">${tc.steps.map((s,j)=>`<div class="ps"><span class="ps-n">${j+1}</span><div class="ps-b"><div class="ps-d">${esc(s.description)}</div><div class="ps-e">→ ${esc(s.expectedResult)}</div></div></div>`).join('')}</div>
  </div>`).join('');
  document.querySelector('.mf').innerHTML=`<button class="cb gh" onclick="closeModal()">Cancel</button><span style="font-size:12px;color:var(--muted);flex:1">${generatedCases.length} case(s)</span><button class="cb ok" id="addbtn" onclick="addGenCases()">✅ Add (${genSelected.length})</button>`;
}

function handleDocFile(e){const f=e.target.files[0];if(f)processDocFile(f);}
async function processDocFile(file){
  const ext=file.name.split('.').pop().toLowerCase(),status=document.getElementById('doc-status'),prog=document.getElementById('dprog'),pb=document.getElementById('dpb');
  try{status.textContent='⏳ Reading…';prog.style.display='block';pb.style.width='35%';
    let text='';
    if(ext==='docx')text=await parseDocx(file);else if(ext==='pdf')text=await parsePdf(file);else text=await file.text();
    pb.style.width='100%';
    if(!text.trim()){status.style.color='var(--fail)';status.textContent='❌ No text found. Try copy-pasting content instead.';return;}
    status.style.color='var(--pass)';status.textContent=`✅ Extracted ${text.split('\n').filter(x=>x.trim()).length} lines. Opening generator…`;
    setTimeout(()=>{closeModal();openGenModal(text);},600);
  }catch(e){pb.style.background='var(--fail)';status.style.color='var(--fail)';status.textContent='❌ '+e.message;}
}
async function parseDocx(file){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
  if(!window.JSZip)throw new Error('JSZip failed to load. Check internet connection.');
  const zip=await JSZip.loadAsync(await file.arrayBuffer());
  const entry=zip.file('word/document.xml');if(!entry)throw new Error('Not a valid DOCX file.');
  const xml=await entry.async('text');
  const lines=[];
  // Match each paragraph block
  const paraRe=/<w:p[ >][\s\S]*?<\/w:p>/g;
  let pm;
  while((pm=paraRe.exec(xml))!==null){
    const para=pm[0];
    // Detect heading style
    const styleM=para.match(/<w:pStyle\s+w:val="([^"]+)"/);
    const style=(styleM?styleM[1]:'').toLowerCase();
    const isHeading=/heading|title/.test(style);
    // Detect list (numbered or bulleted)
    const isList=!!para.match(/<w:numId\s+w:val=/);
    // Extract ONLY the actual text runs (<w:t> elements)
    const parts=[];
    const tRe=/<w:t(?:\s[^>]*)?>([^<]*)<\/w:t>/g;
    let tm;
    while((tm=tRe.exec(para))!==null)parts.push(tm[1]);
    const raw=parts.join('').replace(/\s+/g,' ').trim();
    if(!raw||raw.length<4)continue;
    // Skip lines that are pure numbers (page numbers etc)
    if(/^\d{1,4}$/.test(raw))continue;
    // Skip lines with mostly non-printable/garbage chars
    const printable=(raw.match(/[\x20-\x7E\u00C0-\u024F]/g)||[]).length;
    if(printable/raw.length<0.7)continue;
    // Format with heading/bullet markers so the generator can split correctly
    if(isHeading)lines.push('## '+raw);
    else if(isList)lines.push('• '+raw);
    else lines.push(raw);
  }
  if(!lines.length)throw new Error('No readable text found in this document. Try saving it as .txt first.');
  return lines.join('\n');
}
async function parsePdf(file){
  if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');if(!window.pdfjsLib)throw new Error('PDF.js failed to load.');window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}
  const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const allLines=[];
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);
    const c=await page.getTextContent();
    // Group text items by their Y position (same line)
    const lm={};
    for(const item of c.items){
      if(!item.str.trim())continue;
      const y=Math.round(item.transform[5]);
      lm[y]=(lm[y]?lm[y]+' ':'')+item.str;
    }
    // Sort top-to-bottom and collect lines
    Object.keys(lm).sort((a,b)=>b-a).forEach(y=>{
      const line=lm[y].trim();
      if(!line||line.length<4)return;
      if(/^\d{1,4}$/.test(line))return; // skip page numbers
      allLines.push(line);
    });
    allLines.push(''); // page break
  }
  const text=allLines.join('\n').replace(/\n{3,}/g,'\n\n').trim();
  if(!text)throw new Error('No readable text found. May be a scanned/image PDF.');
  return text;
}

// TCMGenerator — Intelligent NLP parser
// ═══════════════════════════════════════════
class TCMGenerator{
  generate(text){
    const t=text.trim();if(!t)return[];
    if(this.isGherkin(t))  return this.parseGherkin(t);
    if(this.isUserStory(t))return this.parseUserStory(t);
    return this.splitIntoCases(t);
  }
  isGherkin(t){return/\b(scenario\s*:|feature\s*:|given\s+|when\s+|then\s+)/im.test(t);}
  isUserStory(t){return/\bas\s+an?\b.+\bi\s+want\b/im.test(t);}
  isTestable(t){
    const lo=t.toLowerCase();
    const hasReq=/(should|must|will|shall|can|able to|needs to|verify|ensure|check|test|validate)/i.test(lo);
    const hasAct=/(click|tap|press|swipe|scroll|drag|open|close|type|enter|select|navigate|go to|display|show|appear|hide|trigger)/i.test(lo);
    const hasNoun=/(user|player|system|button|screen|menu|popup|dialog|panel|text|icon|image|list|error|message)/i.test(lo);
    return (hasReq||hasAct)&&(hasNoun||lo.length>20);
  }
  splitIntoCases(text){
    const cases=[];
    const lines=text.split('\n').map(l=>l.trim());
    let section='';
    for(const line of lines){
      if(!line)continue;
      if(/^#{1,3}\s+/.test(line)){section=line.replace(/^#{1,3}\s+/,'').trim();continue;}
      if(line.length<8||/^\d{1,5}$/.test(line))continue;
      const content=line.replace(/^[\u2022\-*\u25ba\d.)\]]+\s*/,'').trim();
      if(content.length<8)continue;
      const sents=this.sentences(content);
      for(const s of sents){
        if(!this.isTestable(s))continue;
        const tc=this.makeCase(s,section);
        if(tc)cases.push(tc);
      }
    }
    if(!cases.length){
      if(this.isTestable(text)){const tc=this.makeCase(text.trim(),'');if(tc)cases.push(tc);}
    }
    return cases;
  }
  makeCase(text,section){
    section=section||'';
    const t=text.trim();
    if(t.length<8||/^\d{1,5}$/.test(t))return null;
    let desc=t,expected='Feature works as expected.';
    const sM=t.match(/^(.+?)\s+(should|must|will|would|needs?\s+to)\s+(.+)$/i);
    const tM=t.match(/^(?:when\s+|if\s+|after\s+)?(.+?)[,\s]+(?:then|so|and\s+it)\s+((?:should|must|will|display|show|appear|navigate|redirect|open|enable|disable|allow|prevent).+)$/i);
    if(tM){desc=tM[1].replace(/^(?:when|if|after)\s+/i,'').trim();expected=tM[2].trim();}
    else if(sM){desc=sM[1].trim();expected=sM[1].trim()+' '+sM[2]+' '+sM[3].trim();}
    const rawSum=section?'['+section+'] '+t:t;
    const summary=rawSum.length>95?rawSum.slice(0,92)+'\u2026':rawSum;
    return{summary,steps:[{description:desc,expectedResult:expected}],priority:this.pri(t),category:this.cat(section+' '+t)};
  }
  sentences(text){
    const raw=text.split(/(?<=[.!?])\s+(?=[A-Z\d"'\-])/);
    return raw.map(s=>s.trim()).filter(s=>s.length>=8&&!/^\d{1,5}$/.test(s));
  }
  parseGherkin(text){
    const cases=[],lines=text.split(/\n/).map(l=>l.trim());
    let cur=null,lastStep=null,inThen=false;
    for(const line of lines){
      if(!line)continue;if(/^feature\s*[:-]/i.test(line))continue;
      if(/^scenario\s*(outline\s*)?:/i.test(line)){if(cur)cases.push(cur);cur={summary:line.replace(/^scenario\s*(outline\s*)?:\s*/i,'').trim(),steps:[],priority:1,category:repo.categories[0]||'Other'};lastStep=null;inThen=false;}
      else if(cur&&/^(given|when)\s+/i.test(line)){lastStep={description:line.replace(/^(given|when)\s+/i,'').trim(),expectedResult:''};cur.steps.push(lastStep);inThen=false;}
      else if(cur&&/^then\s+/i.test(line)){const r=line.replace(/^then\s+/i,'').trim();if(lastStep)lastStep.expectedResult=r;else cur.steps.push({description:'Observe',expectedResult:r});inThen=true;}
      else if(cur&&/^and\s+/i.test(line)){const r=line.replace(/^and\s+/i,'').trim();if(inThen&&lastStep)lastStep.expectedResult+=(lastStep.expectedResult?' ':'')+r;else{lastStep={description:r,expectedResult:''};cur.steps.push(lastStep);}}
      else if(cur&&/^but\s+/i.test(line)){lastStep={description:line.replace(/^but\s+/i,'').trim(),expectedResult:''};cur.steps.push(lastStep);inThen=false;}
    }
    if(cur)cases.push(cur);
    for(const c of cases){c.category=this.cat(c.summary);for(const s of c.steps)if(!s.expectedResult)s.expectedResult='Step completes successfully.';if(!c.steps.length)c.steps.push({description:'Execute the scenario',expectedResult:'Scenario completes successfully.'});}
    return cases.length?cases:this.splitIntoCases(text);
  }
  parseUserStory(text){
    const cases=[];
    for(const block of text.split(/\n\n+/)){
      const m=block.match(/as\s+an?\s+(.+?),?\s+i\s+want\s+(?:to\s+)?(.+?)(?:,?\s+so\s+that\s+(.+))?$/im);
      if(!m){cases.push(...this.splitIntoCases(block));continue;}
      const role=m[1].trim(),act=m[2].trim(),ben=(m[3]||'').trim();
      cases.push({summary:act+' (as '+role+')',priority:this.pri(act),category:this.cat(act+' '+role),steps:[{description:'Navigate as a '+role,expectedResult:'Authenticated as '+role+' successfully.'},{description:act,expectedResult:ben||'Feature works as expected.'}]});
    }
    return cases;
  }
  cat(t){
    const lo=t.toLowerCase();
    const map = {
      'UI': ['button','ui','screen','popup','menu','panel','dialog','click','tap','display'],
      'Economy': ['coin','purchase','buy','economy','shop','store','price','payment','currency'],
      'Audio': ['sound','audio','music','sfx','mute','volume'],
      'Settings': ['setting','preference','config','option','language'],
      'Network': ['network','internet','connect','online','offline','api','server','sync'],
      'Performance': ['fps','performance','lag','loading','speed','memory'],
      'Analytics': ['analytic','event','track','firebase','amplitude'],
      'Gameplay': ['game','play','card','move','score','win','lose','level','board']
    };
    let foundCat = 'Other';
    for (const [key, keywords] of Object.entries(map)) {
      if (keywords.some(k => lo.includes(k))) { foundCat = key; break; }
    }
    const exactMatch = repo.categories.find(c => c.toLowerCase() === foundCat.toLowerCase());
    if (exactMatch) return exactMatch;
    for (const c of repo.categories) { if (lo.includes(c.toLowerCase())) return c; }
    return repo.categories.includes('Other') ? 'Other' : (repo.categories[0] || 'Other');
  }
  pri(t){const lo=t.toLowerCase();if(/critical|crash|fatal|security|data.?loss/.test(lo))return 3;if(/important|major|payment|login|auth/.test(lo))return 2;if(/minor|trivial|cosmetic|typo/.test(lo))return 0;return 1;}
}
